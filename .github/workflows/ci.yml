name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl --write kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / -- /bin/true

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock -r requirements-dev.lock

      - name: Verify Linux sandbox backend
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          from talos import sandbox

          backend = sandbox.select_backend(sandbox.default_backends())
          assert backend is not None and backend.name == "bubblewrap", backend
          print("bubblewrap backend is active")
          PY

      - name: Check public hygiene
        run: python scripts/check-public-hygiene.py

      - name: Run pytest
        run: python -m pytest tests/ -q

      - name: Run adversarial suite
        run: python redteam.py
